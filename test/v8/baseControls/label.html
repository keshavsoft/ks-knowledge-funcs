<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label Control Tests</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-50 flex flex-col gap-8 max-w-2xl mx-auto">
    <a href="index.html" class="text-blue-500 hover:underline">&larr; Back to Base Controls Index</a>
    
    <div>
        <h1 class="text-2xl font-bold mb-6">Label Control (ks-control-type="label")</h1>
        
        <div class="flex flex-col gap-6">
            <!-- Basic Label -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">1. Basic Label</h3>
                <ks-web-component ks-control-type="label" ks-text="First Name"></ks-web-component>
            </div>

            <!-- Custom ID and Name -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">2. With ID and Name</h3>
                <ks-web-component ks-control-type="label" ks-text="Email Address" ks-id="lblEmail" ks-name="email_label"></ks-web-component>
            </div>

            <!-- Custom Class Override -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">3. With Custom Tailwind Class Override</h3>
                <ks-web-component ks-control-type="label" ks-text="Warning Label" ks-class-name="text-red-600 font-bold uppercase tracking-widest text-sm"></ks-web-component>
            </div>
            
            <!-- Long Text Label -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">4. Long Text Label</h3>
                <ks-web-component ks-control-type="label" ks-text="Please carefully read the terms and conditions before proceeding to click the submit button below."></ks-web-component>
            </div>
        </div>
    </div>

    <script type="module" src="../../../index.js"></script>
</body>
</html>
