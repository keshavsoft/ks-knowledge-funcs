<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Classes Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Text Classes Showcase</h1>
        <p class="text-gray-600 mb-6">A visual reference of all styles defined in <code>PREDEFINED_TEXT_CLASSES.json</code>.</p>
        
        <div id="showcase-container" class="space-y-6"></div>
    </div>

    <script type="module">
        import TEXT_CLASSES from '../webComponents/v12/cellRenderers/renderInputControl/v7/PREDEFINED_TEXT_CLASSES.json' with { type: 'json' };

        const container = document.getElementById('showcase-container');

        // Helper to flatten nested JSON object into dot-separated keys (e.g. "table.cell.primary")
        function flattenObject(obj, prefix = '') {
            return Object.keys(obj).reduce((acc, k) => {
                const pre = prefix.length ? prefix + '.' : '';
                if (typeof obj[k] === 'object' && obj[k] !== null) {
                    Object.assign(acc, flattenObject(obj[k], pre + k));
                } else {
                    acc[pre + k] = obj[k];
                }
                return acc;
            }, {});
        }

        const flattenedClasses = flattenObject(TEXT_CLASSES);

        Object.entries(flattenedClasses).forEach(([key, className]) => {
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col space-y-2 p-4 border border-gray-200 rounded-md bg-gray-50 hover:border-blue-400 transition-colors";

            const header = document.createElement('div');
            header.className = "flex flex-col md:flex-row md:justify-between md:items-center gap-2 border-b border-gray-200 pb-2 mb-2";
            
            const title = document.createElement('h3');
            title.className = "font-bold text-indigo-700 text-lg";
            title.textContent = key;

            const code = document.createElement('code');
            code.className = "text-xs text-gray-600 bg-gray-200 px-2 py-1 rounded break-all";
            code.textContent = className;

            header.appendChild(title);
            header.appendChild(code);

            const previewWrapper = document.createElement('div');
            previewWrapper.className = "p-4 bg-white border border-gray-200 rounded overflow-x-auto";
            
            const previewText = document.createElement('span');
            // We apply the exact classes from the JSON directly to the span
            previewText.className = className;
            previewText.textContent = "Preview Text (1,234.56)";

            previewWrapper.appendChild(previewText);

            wrapper.appendChild(header);
            wrapper.appendChild(previewWrapper);
            
            container.appendChild(wrapper);
        });
    </script>
</body>
</html>
