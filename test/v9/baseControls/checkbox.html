<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Control Tests</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-50 flex flex-col gap-8 max-w-2xl mx-auto">
    <a href="index.html" class="text-blue-500 hover:underline">&larr; Back to Base Controls Index</a>
    
    <div>
        <h1 class="text-2xl font-bold mb-6">Checkbox Control (ks-control-type="checkbox")</h1>
        
        <div class="flex flex-col gap-6">
            
            <!-- Standard Checked / Unchecked -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">1. Default State</h3>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <ks-web-component ks-control-type="checkbox"></ks-web-component>
                        <span>Unchecked (Default)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <ks-web-component ks-control-type="checkbox" ks-checked="true"></ks-web-component>
                        <span>Checked (`ks-checked="true"`)</span>
                    </label>
                </div>
            </div>

            <!-- Themes -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">2. Themes</h3>
                <div class="flex gap-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <ks-web-component ks-control-type="checkbox" ks-theme="default"></ks-web-component>
                        <span>Default</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <ks-web-component ks-control-type="checkbox" ks-theme="large"></ks-web-component>
                        <span class="text-lg">Large</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-red-700">
                        <ks-web-component ks-control-type="checkbox" ks-theme="danger" ks-checked="true"></ks-web-component>
                        <span>Danger</span>
                    </label>
                </div>
            </div>

            <!-- Disabled State -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">3. Disabled State</h3>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center gap-2 text-gray-400">
                        <ks-web-component ks-control-type="checkbox" ks-disabled="true"></ks-web-component>
                        <span>Disabled (Unchecked)</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-400">
                        <ks-web-component ks-control-type="checkbox" ks-disabled="true" ks-checked="true"></ks-web-component>
                        <span>Disabled (Checked)</span>
                    </label>
                </div>
            </div>

            <!-- TabIndex & Autofocus -->
            <div class="p-4 bg-white rounded shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">4. Navigation (TabIndex & Autofocus)</h3>
                <div class="flex gap-4">
                    <ks-web-component ks-control-type="checkbox" ks-tab-index="2"></ks-web-component>
                    <ks-web-component ks-control-type="checkbox" ks-autofocus="true"></ks-web-component>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="../../../index.js"></script>
</body>
</html>
