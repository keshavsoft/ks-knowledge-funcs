<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babel Standalone CDN Browser AST Parser 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 1. Official Babel Standalone CDN Script Tag -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        code,
        pre,
        textarea {
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-5xl mx-auto space-y-6">

        <header class="border-b border-slate-800 pb-4 flex items-center justify-between">
            <div>
                <span class="bg-indigo-600 text-white font-extrabold text-xs px-3 py-1 rounded-full">Babel CDN Browser
                    Engine</span>
                <h1 class="text-2xl font-extrabold mt-1">Live In-Browser AST Grouping Sandbox</h1>
            </div>
            <span
                class="text-xs font-mono text-emerald-400 bg-emerald-950 px-3 py-1 rounded-full border border-emerald-800">
                Window.Babel Active
            </span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- LEFT: INPUT JS CODE TEXTAREA -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 block uppercase tracking-wider">Input JavaScript Code
                    (Live Editor):</label>
                <textarea id="code-input"
                    class="w-full h-80 bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-emerald-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner resize-none">import { exec } from "child_process";
import dotenv from "dotenv";
import express from "express";

dotenv.config({ path: ".env" });

const app = express();

app.use("/api", routerFromapi);

if (process.env.OPEN_BROWSER === "true") {
    // exec("start http://localhost:3000");
}</textarea>
            </div>

            <!-- RIGHT: LIVE GROUPED AST OBJECT OUTPUT -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-purple-400 block uppercase tracking-wider">Grouped AST Object (by
                    node.type):</label>
                <pre id="ast-output"
                    class="w-full h-80 bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-sky-300 overflow-auto shadow-inner whitespace-pre-wrap break-all"></pre>
            </div>

        </div>

    </div>

    <!-- 2. BROWSER JAVASCRIPT AST PARSING & GROUPING SCRIPT -->
    <script>
        const codeInput = document.getElementById("code-input");
        const astOutput = document.getElementById("ast-output");

        function parseAndGroupAST() {
            const sourceCode = codeInput.value;

            try {
                // Parse source code directly in browser using Babel Standalone CDN
                const result = Babel.transform(sourceCode, {
                    ast: true,
                    code: false,
                    sourceType: "module"
                });

                const ast = result.ast;
                const groupedOutput = {};

                // Loop ast.program.body and group statements by node.type
                for (const node of ast.program.body) {
                    const type = node.type;
                    const line = sourceCode.slice(node.start, node.end).trim();

                    if (!groupedOutput[type]) {
                        groupedOutput[type] = [];
                    }

                    groupedOutput[type].push(line);
                }

                // Render JSON object on screen
                astOutput.textContent = JSON.stringify(groupedOutput, null, 2);

            } catch (err) {
                astOutput.textContent = "❌ Babel AST Parse Error:\n" + err.message;
            }
        }

        // Attach real-time input listener
        codeInput.addEventListener("input", parseAndGroupAST);

        // Initial parse on load
        parseAndGroupAST();
    </script>
</body>

</html>
